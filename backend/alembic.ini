# Alembic CLI settings. The database URL comes from DATABASE_URL (see migrations/env.py).
# The API applies migrations on startup; use the CLI to create new ones:
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
#   .venv/bin/alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
